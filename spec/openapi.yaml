        - keys
      properties:
        keys:
          type: array
          items:
            type: object
  parameters:
    AcceptVersion:
      name: Accept-Version
      in: header
      description: Comma-separated preferred protocol versions (18.4)
      schema:
        type: string
    Signature:
      name: Signature
      in: header
      description: RFC 9421 signature (12.15)
      schema:
        type: string
    SignatureInput:
      name: Signature-Input
      in: header
      description: RFC 9421 Signature-Input (12.15)
      schema:
        type: string
    ContentDigest:
      name: Content-Digest
      in: header
      description: RFC 9530 sha-256 digest of the body (12.15.2)
      schema:
        type: string
  headers:
    Protocol-Version:
      description: "Negotiated protocol version (18.4); MUST be sent on /agent/message responses"
      schema:
        type: string
    Retry-After:
      description: Seconds to wait
      schema:
        type: integer
    X-RateLimit-Limit:
      schema:
        type: integer
    X-RateLimit-Remaining:
      schema:
        type: integer
    X-RateLimit-Reset:
