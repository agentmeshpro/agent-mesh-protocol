name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check ampro/ tests/ examples/
      - name: Run tests (includes conformance oracles and runnable examples)
        run: pytest -q --tb=short

  core-only:
    # The protocol package must work with only its runtime dependencies;
    # interop extras and their SDK oracles are optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core + test runner only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Import smoke test
        run: python -c "import ampro, ampro.server, ampro.interop; print(ampro.__version__)"
      - name: Run tests without optional extras
        run: pytest -q --tb=short

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the built wheel and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/python -c "import ampro; print(ampro.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[all]"
          pip-audit --skip-editable

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no host-framework imports leaked into the protocol package
        run: |
          # The protocol package must remain framework-agnostic. Detecting
          # imports of major Python web frameworks under ampro/ catches
          # accidental coupling. Tests + examples may use these.
          ! grep -rE "^(from|import) (django|flask|fastapi|starlette|tornado|aiohttp|sanic)" ampro/
