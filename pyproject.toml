[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampro"
version = "0.5.0"
description = "An open protocol for agent-to-agent communication: trust, delegation and compliance built in, interoperable with A2A, PACT and MCP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "AMP Contributors", email = "vedant@catlyst.com" },
]
keywords = ["agent", "protocol", "a2a", "mesh", "ampro", "ampi", "rfc9421", "agent-mesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "cryptography>=41.0",
    "base58>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = [
    "uvicorn>=0.29",
]
flask = [
    "flask>=3.0",
]
a2a = [
    "pyjwt[crypto]>=2.8",
]
pact = [
    "pyjwt[crypto]>=2.8",
]
mcp = []
redis = [
    "redis>=5",
]
all = [
    "ampro[server,a2a,pact,mcp,redis,conformance]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "uvicorn>=0.29",
    "fastapi>=0.110",
    "pyjwt[crypto]>=2.8",
    "a2a-sdk>=1.0",
    "mcp>=2.0",
    "jsonschema>=4.18",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
    "redis>=5",
    "fakeredis[lua]>=2.20",
]
conformance = [
    "jsonschema>=4.18",
]

[project.scripts]
ampro-server = "ampro.server.cli:main"
ampro-conformance = "ampro.conformance.cli:main"

[project.urls]
Homepage = "https://ampro.sh"
Repository = "https://github.com/agentmeshpro/agent-mesh-protocol"
Issues = "https://github.com/agentmeshpro/agent-mesh-protocol/issues"
Documentation = "https://github.com/agentmeshpro/agent-mesh-protocol/blob/main/docs/WIRE-BINDING.md"
Changelog = "https://github.com/agentmeshpro/agent-mesh-protocol/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["ampro"]

[tool.hatch.build.targets.sdist]
# The demo site and CI config are not part of the Python package.
exclude = ["/site", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Baseline rules for 0.3.x. We run pycodestyle (E/W), pyflakes (F), and
# isort (I). pyupgrade (UP) is intentionally omitted — the codebase is
# gradually adopting `X | Y` unions; enabling UP en bloc would churn
# hundreds of lines with no behaviour change. Revisit for 1.0.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # long lines ok in docstrings + vector fixtures
    "E402",  # module-level imports not at top — used deliberately for
             # lazy-registered globals (see trust/resolver.py).
    "F401",  # unused imports — server adapter fallback imports need to
             # test for a framework's presence without touching the name.
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely build up fixtures as scaffolding for assertions later
# in the file, and read naturally even when the variable is only used
# for its side effects (e.g. minting a keypair). ``lambda``-assignment
# is allowed for single-line test helpers.
"tests/**/*.py" = ["F841", "E731"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
